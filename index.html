          <div class="header-text">
            <h1>Productivity Dashboard</h1>
            <span>Mission Command</span>
          </div>
        </div>
        <div class="main-card">
          <div class="connection">
            <div class="blinking-light"></div>
            <span>Connection Established</span>
          </div>
          <h2>Commander Identification</h2>
          <p>
            Verify identity to access mission control systems and classified
            telemetry data.
          </p>
          <form>
            <label for="email">COMMANDER EMAIL</label>
            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                name="email"
                placeholder="obiwan@highground.com"
                autocomplete="email"
              />
              <svg
                class="email-svg"
                fill="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M3.75 5.25L3 6V18L3.75 18.75H20.25L21 18V6L20.25 5.25H3.75ZM4.5 7.6955V17.25H19.5V7.69525L11.9999 14.5136L4.5 7.6955ZM18.3099 6.75H5.68986L11.9999 12.4864L18.3099 6.75Z"
                />
              </svg>
            </div>
            <label for="password">ACCESS CODE</label>
            <button type="submit">
              <svg
                fill="currentColor"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
                <path
                  d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09"
                />
                <path
                  d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z"
                />
                <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05" />
              </svg>
              Launch Dashboard
            </button>
            <div class="or-breakline">
              <hr />
              <span>or</span>
              <hr />
            </div>
            <div
              id="g_id_onload"
              data-client_id="759302179418-6ceak16q8qba0qo8bualdbpiiavs01qp.apps.googleusercontent.com"

              data-ux_mode="popup"

              data-auto_select="false"
              data-itp_support="true"

              data-shape="rectangular"
              data-text="signin_with"
              data-size="large"
