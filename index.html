<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Productivity Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="starry-background" aria-hidden="true"></div>

    <main>
      <section class="dashboard-sign" id="dashboard-sign">
        <div class="header">
          <image class="logo" src="ICONS/atomic.svg" />
          <div class="header-text">
            <h1>Productivity Board</h1>
            <span>Mission Command</span>
          </div>
        </div>
        <div class="main-card">
          <div class="connection">
            <div class="blinking-light"></div>
            <span>Connection Established</span>
          </div>
          <h2>Commander Identification</h2>
          <p>
            Verify identity to access mission control systems and classified
            telemetry data.
          </p>
          <form>
            <label for="email">COMMANDER EMAIL</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="obiwan@highground.com"
              autocomplete=""
            />
            <label for="password">ACCESS CODE</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="(555) 501‑0000"
              autocomplete=""
            />
          </form>
        </div>
      </section>
    </main>

    <script src="index.js"></script>
  </body>
</html>
